<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome KH World - MyBatis Community</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Noto Sans KR", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }
        .main-container {
            background: white;
            margin: 20px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #4b89fc 0%, #357abd 100%);
            color: white;
            padding: 40px 0;
            text-align: center;
        }
        .header h1 {
            font-size: 3rem;
            font-weight: 700;
            margin: 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        .header p {
            font-size: 1.2rem;
            margin: 10px 0 0 0;
            opacity: 0.9;
        }
        .features {
            padding: 60px 40px;
        }
        .feature-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 30px;
            margin-top: 40px;
        }
        .feature-card {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            transition: transform 0.3s ease;
            border: 2px solid transparent;
        }
        .feature-card:hover {
            transform: translateY(-5px);
            border-color: #4b89fc;
        }
        .feature-icon {
            font-size: 3rem;
            margin-bottom: 20px;
        }
        .feature-card h3 {
            color: #4b89fc;
            margin-bottom: 15px;
        }
        .login-section {
            background: #f8f9fa;
            padding: 40px;
            text-align: center;
        }
        .btn-custom {
            background: #4b89fc;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            color: white;
            font-weight: 600;
            margin: 10px;
            transition: all 0.3s ease;
        }
        .btn-custom:hover {
            background: #357abd;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(75, 137, 252, 0.4);
        }
    </style>
</head>
<body>
    <div class="main-container">
        <div class="header">
            <h1>🚀 MyBatis Community</h1>
            <p>MyBatis ORM을 활용한 JSP 기반 웹 애플리케이션</p>
        </div>
        
        <div class="features">
            <h2 class="text-center mb-4" style="color: #4b89fc;">주요 기능</h2>
            <div class="feature-grid">
                <div class="feature-card">
                    <div class="feature-icon">👤</div>
                    <h3>회원 관리</h3>
                    <p>로그인, 회원가입, 마이페이지 관리</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">📝</div>
                    <h3>게시판</h3>
                    <p>CRUD 기능과 파일 업로드</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🔍</div>
                    <h3>검색 기능</h3>
                    <p>제목, 내용, 작성자별 검색</p>
                </div>
                <div class="feature-card">
                    <div class="feature-icon">🖼️</div>
                    <h3>썸네일</h3>
                    <p>다중 이미지 업로드 및 관리</p>
                </div>
            </div>
        </div>
        
        <div class="login-section">
            <h3 style="color: #4b89fc; margin-bottom: 30px;">지금 시작하세요!</h3>
            <button class="btn btn-custom">로그인</button>
            <button class="btn btn-custom">회원가입</button>
        </div>
    </div>
</body>
</html>
