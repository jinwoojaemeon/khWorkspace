<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 - MyBatis Community</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Noto Sans KR", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .login-container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .login-header h2 {
            color: #4b89fc;
            font-weight: 700;
            margin-bottom: 10px;
        }
        .login-header p {
            color: #666;
            margin: 0;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-label {
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 10px;
            padding: 12px 15px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #4b89fc;
            box-shadow: 0 0 0 0.2rem rgba(75, 137, 252, 0.25);
        }
        .btn-login {
            background: linear-gradient(135deg, #4b89fc 0%, #357abd 100%);
            border: none;
            border-radius: 10px;
            padding: 15px;
            font-size: 18px;
            font-weight: 600;
            color: white;
            width: 100%;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(75, 137, 252, 0.3);
        }
        .btn-register {
            background: transparent;
            border: 2px solid #4b89fc;
            color: #4b89fc;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: all 0.3s ease;
        }
        .btn-register:hover {
            background: #4b89fc;
            color: white;
        }
        .divider {
            text-align: center;
            margin: 30px 0;
            position: relative;
        }
        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e9ecef;
        }
        .divider span {
            background: white;
            padding: 0 20px;
            color: #666;
        }
        .features {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 1px solid #e9ecef;
        }
        .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            color: #666;
            font-size: 14px;
        }
        .feature-item::before {
            content: '✓';
            color: #4b89fc;
            font-weight: bold;
            margin-right: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2>🔐 로그인</h2>
            <p>MyBatis Community에 오신 것을 환영합니다</p>
        </div>
        
        <form>
            <div class="form-group">
                <label class="form-label">아이디</label>
                <input type="text" class="form-control" placeholder="아이디를 입력하세요">
            </div>
            
            <div class="form-group">
                <label class="form-label">비밀번호</label>
                <input type="password" class="form-control" placeholder="비밀번호를 입력하세요">
            </div>
            
            <button type="submit" class="btn-login">로그인</button>
            
            <div class="divider">
                <span>또는</span>
            </div>
            
            <button type="button" class="btn-register">회원가입</button>
        </form>
        
        <div class="features">
            <div class="feature-item">MyBatis ORM 프레임워크 활용</div>
            <div class="feature-item">실시간 검색 기능</div>
            <div class="feature-item">파일 업로드 지원</div>
            <div class="feature-item">Ajax 댓글 시스템</div>
        </div>
    </div>
</body>
</html>
