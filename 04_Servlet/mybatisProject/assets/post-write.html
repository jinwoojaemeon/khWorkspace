<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성 - MyBatis Community</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: "Noto Sans KR", sans-serif;
            background: #f8f9fa;
            margin: 0;
            padding: 0;
        }
        .navbar {
            background: #343a40 !important;
            padding: 15px 0;
        }
        .navbar-brand {
            color: white !important;
            font-weight: 700;
            font-size: 1.5rem;
        }
        .nav-link {
            color: white !important;
            font-weight: 500;
            margin: 0 15px;
            transition: color 0.3s ease;
        }
        .nav-link:hover {
            color: #ffc107 !important;
        }
        .write-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 2rem;
        }
        .write-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }
        .write-card h2 {
            text-align: center;
            color: #333;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid #4b89fc;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-label {
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            display: block;
        }
        .form-control {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 16px;
            transition: all 0.3s ease;
            width: 100%;
        }
        .form-control:focus {
            border-color: #4b89fc;
            box-shadow: 0 0 0 0.2rem rgba(75, 137, 252, 0.25);
        }
        .form-select {
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 12px 15px;
            font-size: 16px;
            background: white;
        }
        .form-select:focus {
            border-color: #4b89fc;
            box-shadow: 0 0 0 0.2rem rgba(75, 137, 252, 0.25);
        }
        .form-textarea {
            resize: vertical;
            min-height: 200px;
        }
        .file-upload-area {
            border: 2px dashed #4b89fc;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background: #f8f9ff;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }
        .file-upload-area:hover {
            background: #e8f2ff;
            border-color: #357abd;
        }
        .file-upload-icon {
            font-size: 3rem;
            color: #4b89fc;
            margin-bottom: 15px;
        }
        .file-upload-text {
            color: #666;
            font-size: 16px;
            margin-bottom: 10px;
        }
        .file-upload-hint {
            color: #999;
            font-size: 14px;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }
        .btn-write {
            background: linear-gradient(135deg, #4b89fc 0%, #357abd 100%);
            border: none;
            border-radius: 8px;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-write:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(75, 137, 252, 0.3);
        }
        .btn-cancel {
            background: #6c757d;
            border: none;
            border-radius: 8px;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-cancel:hover {
            background: #5a6268;
            transform: translateY(-2px);
        }
        .required {
            color: #dc3545;
        }
        .form-help {
            font-size: 14px;
            color: #666;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">🚀 MyBatis Community</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="#">HOME</a></li>
                <li class="nav-item"><a class="nav-link" href="#">공지사항</a></li>
                <li class="nav-item"><a class="nav-link" href="#">일반게시판</a></li>
                <li class="nav-item"><a class="nav-link" href="#">사진게시판</a></li>
            </ul>
        </div>
    </nav>

    <div class="write-container">
        <div class="write-card">
            <h2>✏️ 게시글 작성</h2>
            
            <form>
                <div class="form-group">
                    <label class="form-label">카테고리 <span class="required">*</span></label>
                    <select class="form-select" required>
                        <option value="">카테고리를 선택하세요</option>
                        <option value="common">공통</option>
                        <option value="tech">기술</option>
                        <option value="question">질문</option>
                        <option value="notice">공지</option>
                        <option value="free">자유</option>
                        <option value="review">후기</option>
                        <option value="etc">기타</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label class="form-label">제목 <span class="required">*</span></label>
                    <input type="text" class="form-control" placeholder="제목을 입력하세요" required>
                    <div class="form-help">최대 100자까지 입력 가능합니다.</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">내용 <span class="required">*</span></label>
                    <textarea class="form-control form-textarea" placeholder="내용을 입력하세요" required></textarea>
                    <div class="form-help">최대 2000자까지 입력 가능합니다.</div>
                </div>
                
                <div class="form-group">
                    <label class="form-label">첨부파일</label>
                    <div class="file-upload-area">
                        <div class="file-upload-icon">📎</div>
                        <div class="file-upload-text">파일을 선택하거나 여기에 드래그하세요</div>
                        <div class="file-upload-hint">최대 50MB까지 업로드 가능합니다.</div>
                        <input type="file" class="form-control" style="margin-top: 15px;" accept=".jpg,.jpeg,.png,.gif,.pdf,.doc,.docx">
                    </div>
                </div>
                
                <div class="btn-group">
                    <button type="submit" class="btn-write">📝 작성하기</button>
                    <button type="button" class="btn-cancel">❌ 취소하기</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
